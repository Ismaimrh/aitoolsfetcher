[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitoolsfetcher"
version = "0.1.0"
description = "Discover and track trending AI tools across GitHub, HuggingFace, Reddit, arXiv, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AIToolsFetcher Contributors" }]
keywords = ["ai", "tools", "discovery", "github", "trending", "machine-learning", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "click>=8.1,<9",
    "rich>=13.0,<14",
    "apscheduler>=3.10,<4",
    "aiosqlite>=0.20,<1",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
notion = ["notion-client>=2.0,<3"]
email = ["aiosmtplib>=3.0,<4"]
llm = ["anthropic>=0.39,<1", "openai>=1.50,<2"]
all = ["aitoolsfetcher[notion,email,llm]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.11",
]

[project.scripts]
aitoolsfetcher = "aitoolsfetcher.cli:main"

[project.urls]
Homepage = "https://github.com/aitoolsfetcher/aitoolsfetcher"
Repository = "https://github.com/aitoolsfetcher/aitoolsfetcher"
Issues = "https://github.com/aitoolsfetcher/aitoolsfetcher/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aitoolsfetcher"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
